<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="1.6;url=https://maomao1ovo1.github.io/">
<title>毛毛的个人主页</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#e5dcff 0%,#ffffff 55%,#7c5cbf26 100%);
    color:#333;
  }
  .card{
    text-align:center;padding:44px 52px;width:90%;max-width:360px;
    background:#ffffffd9;border:1px solid #e5dcff;border-radius:26px;
    box-shadow:0 20px 60px rgba(101,67,165,.20);backdrop-filter:blur(6px);
  }
  .logo{font-size:60px;line-height:1;margin-bottom:14px}
  .name{font-size:23px;font-weight:800;color:#6543a5;letter-spacing:.5px;margin-bottom:6px}
  .sub{font-size:14px;color:#888;margin-bottom:24px}
  .spinner{width:36px;height:36px;margin:0 auto 22px;border:4px solid #e5dcff;border-top-color:#7c5cbf;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .note{font-size:13px;color:#999}
  .note a{color:#7c5cbf;font-weight:600;text-decoration:none}
  .note a:hover{text-decoration:underline}
  @media (prefers-color-scheme:dark){
    body{background:linear-gradient(135deg,#1a1630,#121212 55%,#33245c)}
    .card{background:#1e1b30e6;border-color:#33245c;box-shadow:0 20px 60px rgba(0,0,0,.6)}
    .name{color:#bb9cff}
    .sub{color:#aaa}
    .spinner{border-color:#33245c;border-top-color:#bb9cff}
    .note{color:#888}
    .note a{color:#bb9cff}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🐱</div>
    <div class="name">毛毛的个人主页</div>
    <div class="sub">正在跳转到主站…</div>
    <div class="spinner"></div>
    <div class="note">没自动跳转？<a href="https://maomao1ovo1.github.io/">点这里进入</a></div>
    <script>setTimeout(function(){location.replace("https://maomao1ovo1.github.io/");},1300);</script>
  </div>
</body>
</html>
